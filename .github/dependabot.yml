# Weekly suggestions to update libraries (security fixes first). Each one arrives as a pull request
# that the Checks workflow tests before you decide to merge it.
# Big version jumps (for example TypeScript 6 -> 7, ESLint 9 -> 10) are not suggested automatically: they can
# change how code is checked or built, so they are done by hand and tested on purpose. Security fixes still arrive.
version: 2
updates:
  - package-ecosystem: npm
    directory: /folio
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /folio-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo sets the exact versions of these for each SDK; upgrade them only together with Expo itself
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
